services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docuquery-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-docuquery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuquery} -d ${POSTGRES_DB:-docuquery}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - docuquery-net
    restart: unless-stopped

  migrate:
    image: prat31s/docuquery-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuquery-migrate
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuquery}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-docuquery}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docuquery-net
    restart: "no"

  backend:
    image: prat31s/docuquery-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: docuquery-backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docuquery}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-docuquery}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-llama3}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      JINA_EMBEDDING_MODEL: ${JINA_EMBEDDING_MODEL:-jina-embeddings-v3}
      JINA_EMBEDDING_URL: ${JINA_EMBEDDING_URL:-https://api.jina.ai/v1/embeddings}
      JINA_API_KEY: ${JINA_API_KEY:-}
      EMBEDDING_CACHE_PATH: /app/.cache/embedding_cache.sqlite3
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
    volumes:
      # Persist uploaded documents
      - document_storage:/app/backend/storage
      # Persist SQLite embedding cache
      - embedding_cache:/app/.cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/test/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - docuquery-net
    extra_hosts:
      # Allows Linux hosts to reach a local LLM server on the host machine
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: prat31s/docuquery-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Change this if the backend is not reachable at localhost:8000 from the browser
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: docuquery-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docuquery-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  document_storage:
    driver: local
  embedding_cache:
    driver: local

networks:
  docuquery-net:
    driver: bridge